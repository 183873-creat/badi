<title>مطعم البديع | El Badiaa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one long dark-ivory scroll. Sticky nav, split hero with an arched photo, gold marquee, story, dish cards, bento gallery, review, contact. Gold only on ornaments and actions. */
:root {
  --ink: #0e1512;
  --ink-2: #151e19;
  --ink-3: #1d2822;
  --line: #2e3b34;
  --gold: #c8a45a;
  --gold-soft: #e6d3a1;
  --ivory: #f3ecdc;
  --muted: #a8ada1;
  --f-display: "Cormorant Garamond", "Amiri", Georgia, serif;
  --f-body: "Jost", "Cairo", system-ui, sans-serif;
  color-scheme: dark;
}
:root[lang="ar"] { --f-display: "Amiri", "Cormorant Garamond", serif; --f-body: "Cairo", "Jost", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--ink); color: var(--ivory);
  font: 400 16px/1.75 var(--f-body);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 14px; }
:root:not([lang="ar"]) .eyebrow { letter-spacing: .24em; }
:root[lang="ar"] .eyebrow { font-size: .95rem; }
.eyebrow::before { content: ""; width: 38px; height: 1px; background: var(--gold); }
.h2 { font-size: clamp(2.1rem, 5vw, 3.4rem); }
:root[lang="ar"] .h2 { line-height: 1.4; }

/* nav */
header.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
.brand { font-family: var(--f-display); font-size: 1.5rem; color: var(--gold-soft); text-decoration: none; white-space: nowrap; }
.nav ul { list-style: none; display: flex; gap: 28px; margin: 0; padding: 0; font-size: .92rem; }
.nav ul a { text-decoration: none; color: var(--muted); transition: color .3s; }
.nav ul a:hover { color: var(--gold-soft); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; direction: ltr; }
.lang button { font: 500 .78rem var(--f-body); background: none; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: all .3s; }
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
@media (max-width: 820px) { .nav ul { display: none; } }

/* hero */
.hero { padding-block: clamp(40px, 8vw, 90px) clamp(48px, 8vw, 100px); position: relative; background:
  radial-gradient(60% 60% at 80% 20%, rgba(200,164,90,.13), transparent 70%),
  radial-gradient(50% 50% at 10% 90%, rgba(200,164,90,.07), transparent 70%); }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(28px, 6vw, 80px); align-items: center; }
.hero-copy { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.hero h1 { font-size: clamp(3rem, 9vw, 6.4rem); color: var(--ivory); overflow: hidden; padding-block: .06em; }
:root[lang="ar"] .hero h1 { line-height: 1.5; }
.hero h1 span { display: inline-block; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
.hero h1 em { font-style: italic; color: var(--gold); }
.tagline { font-family: var(--f-display); font-size: clamp(1.25rem, 2.6vw, 1.75rem); color: var(--gold-soft); min-height: 2.9em; }
.tagline::after { content: ""; display: inline-block; width: 2px; height: 1em; background: var(--gold); margin-inline-start: 4px; vertical-align: -.12em; animation: blink 1s steps(1) infinite; }
.lead { color: var(--muted); max-width: 52ch; animation: fade 1.4s .5s both; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; animation: fade 1.4s .8s both; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px; font: 500 .95rem var(--f-body); text-decoration: none; cursor: pointer; border: 1px solid var(--gold); transition: all .35s; }
.btn.solid { background: var(--gold); color: var(--ink); }
.btn.solid:hover { background: var(--gold-soft); }
.btn.ghost { background: none; color: var(--gold-soft); }
.btn.ghost:hover { background: rgba(200,164,90,.12); }
.arch { position: relative; justify-self: center; width: min(100%, 440px); aspect-ratio: 4/5.2; border-radius: 999px 999px 18px 18px; overflow: hidden; border: 1px solid var(--gold); padding: 10px; animation: fade 1.6s .2s both; }
.arch::before { content: ""; position: absolute; inset: 10px; border-radius: 999px 999px 10px 10px; border: 1px solid rgba(230,211,161,.35); z-index: 2; pointer-events: none; }
.arch img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px 999px 10px 10px; display: block; animation: kb 22s ease-in-out infinite alternate; }
.badge { position: absolute; inset-inline-start: -4px; bottom: 36px; z-index: 3; background: var(--ink); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 18px; display: flex; flex-direction: column; line-height: 1.3; }
.badge b { font: 500 1.8rem var(--f-display); color: var(--gold-soft); }
.badge small { color: var(--muted); font-size: .78rem; }
@media (max-width: 860px) { .hero .wrap { grid-template-columns: 1fr; } .arch { width: min(86%, 380px); } .badge { inset-inline-start: 0; } }

/* marquee */
.marq { border-block: 1px solid var(--line); background: var(--ink-2); overflow: hidden; direction: ltr; }
.marq-track { display: flex; width: max-content; animation: marq 40s linear infinite; }
.marq-track span { font: 400 1.5rem var(--f-display); color: var(--gold-soft); padding: 18px 28px; white-space: nowrap; display: flex; align-items: center; gap: 56px; }
.marq-track span::after { content: "✦"; color: var(--gold); font-size: .8rem; }

section { padding-block: clamp(64px, 10vw, 120px); }
/* about */
.about .wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(28px, 6vw, 80px); align-items: center; }
.about-img { position: relative; }
.about-img img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; border-radius: 6px; }
.about-img::after { content: ""; position: absolute; inset: -14px 14px 14px -14px; border: 1px solid var(--gold); border-radius: 6px; z-index: -1; }
:root[dir="rtl"] .about-img::after { inset: -14px -14px 14px 14px; }
.about-copy { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.about-copy p { color: var(--muted); max-width: 56ch; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); margin-top: 10px; }
.facts div { padding: 20px 12px 0; display: flex; flex-direction: column; gap: 2px; }
.facts div + div { border-inline-start: 1px solid var(--line); padding-inline-start: 18px; }
.facts b { font: 500 1.7rem var(--f-display); color: var(--gold-soft); }
.facts small { color: var(--muted); font-size: .82rem; line-height: 1.5; }
@media (max-width: 860px) { .about .wrap { grid-template-columns: 1fr; } .about-img { max-width: 420px; } }

/* dishes */
.dishes { background: var(--ink-2); }
.sec-head { display: flex; flex-direction: column; gap: 16px; margin-bottom: 48px; max-width: 640px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
.card { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card .ph { overflow: hidden; border-radius: 6px; aspect-ratio: 4/5; border: 1px solid var(--line); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
.card:hover img { transform: scale(1.07); }
.card h3 { font-size: 1.6rem; color: var(--gold-soft); }
:root[lang="ar"] .card h3 { line-height: 1.5; }
.card p { color: var(--muted); font-size: .94rem; }

/* gallery */
.bento { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: clamp(170px, 24vw, 290px); gap: 16px; }
.bento figure { margin: 0; overflow: hidden; border-radius: 6px; position: relative; border: 1px solid var(--line); }
.bento img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
.bento figure:hover img { transform: scale(1.06); }
.bento figcaption { position: absolute; inset: auto 0 0 0; padding: 40px 18px 14px; background: linear-gradient(transparent, rgba(8,12,10,.85)); font: 400 1.15rem var(--f-display); color: var(--gold-soft); }
.b1 { grid-column: span 5; grid-row: span 2; }
.b2 { grid-column: span 7; }
.b3 { grid-column: span 7; }
.b3 img { object-position: 50% 45%; }
@media (max-width: 720px) { .b1, .b2, .b3 { grid-column: 1 / -1; } .b1 { grid-row: span 2; } }

/* review */
.review { background: var(--ink-2); text-align: center; }
.review .wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
.quote { font: 400 clamp(1.7rem, 4vw, 2.6rem)/1.5 var(--f-display); max-width: 24ch; color: var(--ivory); }
.quote::before { content: "“"; display: block; font-size: 4rem; line-height: .6; color: var(--gold); }
.review small { color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 12px; color: var(--gold-soft); font-family: var(--f-display); }
.score b { font-size: 3.2rem; font-weight: 500; }

/* contact */
.contact .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 6vw, 80px); align-items: start; }
.contact h2 { margin-block: 16px 20px; }
.contact .intro { color: var(--muted); max-width: 44ch; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.row > div { min-width: 0; }
.row small { display: block; color: var(--gold); font-size: .78rem; text-transform: uppercase; }
:root:not([lang="ar"]) .row small { letter-spacing: .2em; }
:root[lang="ar"] .row small { font-size: .9rem; }
.row .v { font: 500 1.5rem var(--f-display); direction: ltr; unicode-bidi: plaintext; overflow-wrap: anywhere; user-select: all; }
.row .v.txt { direction: inherit; }
.mini { font: 500 .82rem var(--f-body); background: none; border: 1px solid var(--line); color: var(--gold-soft); border-radius: 999px; padding: 8px 16px; cursor: pointer; text-decoration: none; transition: all .3s; white-space: nowrap; }
.mini:hover { border-color: var(--gold); background: rgba(200,164,90,.1); }
@media (max-width: 860px) { .contact .wrap { grid-template-columns: 1fr; } }

footer { border-top: 1px solid var(--line); padding-block: 36px; color: var(--muted); font-size: .88rem; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
footer b { font-family: var(--f-display); font-weight: 500; color: var(--gold-soft); font-size: 1.15rem; }

/* motion */
@keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.12); } }
@keyframes marq { to { transform: translateX(-50%); } }
@keyframes rv { from { opacity: .08; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes rvimg { from { opacity: .1; transform: scale(.93); } to { opacity: 1; transform: none; } }
@supports (animation-timeline: view()) {
  .rv { animation: rv linear both; animation-timeline: view(); animation-range: entry 0% entry 45%; }
  .rvimg { animation: rvimg linear both; animation-timeline: view(); animation-range: entry 0% entry 55%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

var cur = "ar", typeTimer = null;

function typeText(el, text) {
  clearTimeout(typeTimer);
  if (reduce) { el.textContent = text; return; }
  el.textContent = "";
  var i = 0;
  (function step() {
    el.textContent = text.slice(0, ++i);
